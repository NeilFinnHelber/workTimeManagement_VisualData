version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: worktime_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visual_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/data.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - worktime_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  worktime_network:
    driver: bridge