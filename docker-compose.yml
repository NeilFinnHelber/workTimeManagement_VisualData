version: '3.8'

services:
  mariadb:
    image: mariadb:11.1
    container_name: worktime_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword   
      MYSQL_DATABASE: visual_data         
      MYSQL_USER: workuser               
      MYSQL_PASSWORD: workpassword       
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/data.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - worktime_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:

networks:
  worktime_network:
    driver: bridge